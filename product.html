<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Товар — Friend Guide</title>
  <meta name="description" content="Страница аромата Friend Guide: ноты, комнаты, характер и добавление в корзину." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header" data-header></header>

  <main class="section">
    <div class="container">
      <a href="catalog.html" class="small" style="display:inline-flex;gap:8px;align-items:center;color:rgba(255,255,255,.70)">← Назад в каталог</a>

      <div class="pgrid">
        <div class="glass card card-lift">
          <div class="media"><img id="img" alt="" /></div>
          <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px" id="chips"></div>
        </div>

        <div>
          <h1 class="h2" id="title">—</h1>
          <div class="small" style="margin-top:10px" id="meta">—</div>
          <p class="p" style="margin-top:14px;font-size:16px" id="desc">—</p>

          <div class="note-grid" style="margin-top:16px">
            <div class="glass card">
              <div style="font-weight:800">Ноты</div>
              <div style="margin-top:10px;display:grid;gap:10px" id="notes"></div>
            </div>

            <div class="glass card">
              <div style="font-weight:800">Где звучит лучше</div>
              <p class="p" style="margin-top:8px">Рекомендуем для:</p>
              <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px" id="rooms"></div>
              <div class="small" style="margin-top:12px">Совет: начни с 4–5 палочек и подстрой под комнату.</div>
            </div>
          </div>

          <div class="glass card" style="margin-top:16px">
            <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between">
              <div>
                <div class="small">Цена</div>
                <div style="font-size:28px;font-weight:900" id="price">—</div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:10px">
                <button class="btn btn-secondary" id="add">В корзину</button>
                <a class="btn btn-primary" data-ozon href="#">Купить на Ozon</a>
              </div>
            </div>
          </div>

          <div style="margin-top:18px">
            <div style="font-weight:800">Ещё варианты</div>
            <div class="products" style="margin-top:12px" id="related"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" data-footer></footer>
  <script type="module" src="js/product.js"></script>
</body>
</html>
